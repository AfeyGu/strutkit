[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strutkit"
description = "通用杆系几何建模库：坐标量化 + 轴/点阵 + 打断不变式 + DXF / FEA 出口"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dxf = ["ezdxf"]      # 导出标准 R2000 DXF（不装则回退到手写 R12）
plot = ["pillow"]    # tools/dxf2svg.py 出 PNG 预览

[tool.setuptools]
packages = ["strutkit", "strutkit.tools"]

[tool.setuptools.dynamic]
version = { attr = "strutkit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
